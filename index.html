<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F6F4;--card:#fff;--ink:#14213D;--mute:#5B6785;--line:#D5DDE8;--ok:#1F9D6B;--hi:#FFD23F;--warn:#B4361E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1524;--card:#17213A;--ink:#EEF2FA;--mute:#9AA6C4;--line:#2A3757;--ok:#3CCB8F;--warn:#FF8A73}}
:root[data-theme="dark"]{--bg:#0E1524;--card:#17213A;--ink:#EEF2FA;--mute:#9AA6C4;--line:#2A3757;--ok:#3CCB8F;--warn:#FF8A73}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
.app{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand p{margin:2px 0 0;color:var(--mute);font-size:14px}
.dots{display:flex;gap:6px;margin:22px 0 18px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--ink)}
h2{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 16px}
.row{display:flex;gap:8px;margin-bottom:12px}
input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input:focus,button:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
input.grow{flex:1}input.n{width:82px}input.t{width:110px}
button{font:600 15px inherit;font-family:inherit;cursor:pointer;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:11px 16px}
button.pri{background:var(--ink);color:var(--bg)}button.add{background:var(--hi);border-color:var(--hi);color:#14213D}
ul{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.item span{flex:1}.item small{color:var(--mute)}
.x{border:0;background:none;color:var(--mute);padding:2px 8px;font-size:20px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.plan .item{align-items:flex-start}.time{font-weight:800;min-width:96px}
.tip{color:var(--warn);font-size:14px;display:block}
.none{border-style:dashed}
.chk{appearance:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:8px;background:var(--card);flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3.5px 3.5px 0;transform:rotate(45deg) translate(-1px,-2px)}
.done span{text-decoration:line-through;color:var(--mute)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 16px}.bar b{display:block;height:100%;background:var(--ok);transition:width .25s}
.win{text-align:center}.win img{width:100%;border-radius:14px;display:block;margin-bottom:16px}.win h2{font-size:28px;font-weight:800;line-height:1.15}
.empty{color:var(--mute);padding:14px;text-align:center;border:1.5px dashed var(--line);border-radius:10px}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 52 52" role="img" aria-label="Logo de Checklist"><rect x="3" y="3" width="46" height="46" rx="12" fill="#14213D"/><rect x="11" y="13" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="3"/><path d="M13.5 20.5l4 4 9-12" fill="none" stroke="#FFD23F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 18h10M11 36h30M11 43h20" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
    <div><h1>Checklist</h1><p>Un check más, un problema menos</p></div>
  </div>
  <div class="dots" id="dots"></div>
  <main id="view"></main>
</div>
<script>
const S={step:0,tasks:[],slots:[],mats:[],variant:0,plan:[],done:{}};
const TOTAL=6;
const HINTS=[["pint","brocha y rodillo"],["limp","paño de microfibra y escoba"],["cocin","sartén y tabla de cortar"],["escrib","portátil o libreta"],["arregl","destornillador y alicates"],["estud","cuaderno y subrayadores"],["lav","detergente y cesto"],["compr","lista y bolsa reutilizable"]];
const $=s=>document.querySelector(s);
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m2t=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const t2m=v=>{const[a,b]=v.split(':').map(Number);return a*60+b};
const list=(arr,fn)=>arr.length?'<ul>'+arr.map(fn).join('')+'</ul>':'<div class="empty">Aún no has añadido nada.</div>';
function nav(prev,nextLabel,nextFn){return `<div class="nav">${prev?'<button onclick="go(-1)">Anterior</button>':'<span></span>'}${nextLabel?`<button class="pri" onclick="${nextFn||'go(1)'}">${nextLabel}</button>`:''}</div>`}
function go(d){S.step+=d;render()}
function build(){
  let order=S.tasks.map((t,i)=>({...t,i}));
  const v=S.variant%4;
  if(v===0)order.sort((a,b)=>b.min-a.min);
  else if(v===1)order.sort((a,b)=>a.min-b.min);
  else if(v===3)order.reverse();
  const free=S.slots.map(s=>({s:s.a,e:s.b,at:s.a})).sort((a,b)=>a.s-b.s);
  const res=order.map(t=>{const sl=free.find(f=>f.e-f.at>=t.min);
    if(!sl)return{...t,ok:false};const a=sl.at;sl.at+=t.min;
    const low=t.name.toLowerCase();const h=HINTS.find(h=>low.includes(h[0]));
    const has=S.mats.some(m=>h&&h[1].split(/ y | o /).some(w=>m.toLowerCase().includes(w.split(' ')[0])));
    return{...t,ok:true,a,b:sl.at,tip:h&&!has?h[1]:null}});
  S.plan=res.sort((x,y)=>(x.ok?x.a:1e9)-(y.ok?y.a:1e9));
}
function render(){
  $('#dots').innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${i<=S.step?'on':''}"></i>`).join('');
  const v=$('#view');
  if(S.step===0)v.innerHTML=`<h2>¿Qué tienes que hacer hoy?</h2><p class="sub">Escribe cada tarea y cuánto tiempo necesita.</p>
  <div class="row"><input class="grow" id="tn" placeholder="Ej.: limpiar la cocina" aria-label="Tarea"><input class="n" id="tm" type="number" min="5" step="5" value="30" aria-label="Minutos"><button class="add" onclick="addTask()">Añadir</button></div>
  ${list(S.tasks,(t,i)=>`<li class="item"><span>${esc(t.name)} <small>${t.min} min</small></span><button class="x" aria-label="Quitar" onclick="S.tasks.splice(${i},1);render()">×</button></li>`)}
  ${nav(false,S.tasks.length?'Siguiente':'')}`;
  if(S.step===1)v.innerHTML=`<h2>¿Qué horas tienes libres?</h2><p class="sub">Añade uno o varios tramos del día.</p>
  <div class="row"><input class="t" id="sa" type="time" value="09:00" aria-label="Desde"><input class="t" id="sb" type="time" value="12:00" aria-label="Hasta"><button class="add" onclick="addSlot()">Añadir</button></div>
  ${list(S.slots,(s,i)=>`<li class="item"><span>${m2t(s.a)} – ${m2t(s.b)} <small>${s.b-s.a} min</small></span><button class="x" aria-label="Quitar" onclick="S.slots.splice(${i},1);render()">×</button></li>`)}
  ${nav(true,S.slots.length?'Siguiente':'')}`;
  if(S.step===2)v.innerHTML=`<h2>¿Con qué cuentas?</h2><p class="sub">Materiales y herramientas disponibles. Puedes dejarlo vacío.</p>
  <div class="row"><input class="grow" id="mn" placeholder="Ej.: escoba, portátil, brocha" aria-label="Material"><button class="add" onclick="addMat()">Añadir</button></div>
  ${list(S.mats,(m,i)=>`<li class="item"><span>${esc(m)}</span><button class="x" aria-label="Quitar" onclick="S.mats.splice(${i},1);render()">×</button></li>`)}
  ${nav(true,'Crear plan','S.variant=0;build();go(1)')}`;
  if(S.step===3){v.innerHTML=`<h2>Tu plan propuesto</h2><p class="sub">Las tareas más largas van a las primeras horas, cuando hay más energía.</p><ul class="plan">
  ${S.plan.map(p=>p.ok?`<li class="item"><span class="time">${m2t(p.a)}–${m2t(p.b)}</span><span>${esc(p.name)}${p.tip?`<em class="tip">Te recomiendo: ${p.tip}</em>`:''}</span></li>`:`<li class="item none"><span class="time">Sin hueco</span><span>${esc(p.name)}<em class="tip">Necesitas ${p.min} min seguidos. Amplía tus horas libres.</em></span></li>`).join('')}</ul>
  <div class="nav"><button onclick="go(-1)">Anterior</button><button onclick="S.variant++;build();render()">Reorganizar</button><button class="pri" onclick="go(1)">Me gusta</button></div>`}
  if(S.step===4){const pl=S.plan.filter(p=>p.ok),d=pl.filter(p=>S.done[p.i]).length;
  v.innerHTML=`<h2>Tu checklist de hoy</h2><p class="sub">${d} de ${pl.length} completadas</p><div class="bar"><b style="width:${pl.length?d/pl.length*100:0}%"></b></div>
  ${list(pl,p=>`<li class="item ${S.done[p.i]?'done':''}"><input type="checkbox" class="chk" aria-label="Completar ${esc(p.name)}" ${S.done[p.i]?'checked':''} onchange="S.done[${p.i}]=this.checked;chkAll();render()"><span>${esc(p.name)} <small>${m2t(p.a)}–${m2t(p.b)}</small></span></li>`)}
  ${nav(true,'')}`}

function chkAll(){const pl=S.plan.filter(p=>p.ok);if(pl.length&&pl.every(p=>S.done[p.i]))S.step=5}
function addTask(){const n=$('#tn').value.trim(),m=+$('#tm').value;if(!n||!m)return;S.tasks.push({name:n,min:m});render();$('#tn').focus()}
function addSlot(){const a=t2m($('#sa').value||'0:0'),b=t2m($('#sb').value||'0:0');if(b<=a)return;S.slots.push({a,b});render()}
function addMat(){const n=$('#mn').value.trim();if(!n)return;S.mats.push(n);render();$('#mn').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(S.step===0)addTask();if(S.step===1)addSlot();if(S.step===2)addMat()}});
render();
